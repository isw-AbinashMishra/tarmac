  /* ── Design tokens: same palette as index.html / tasks.html so the pages
     feel like one app. Theme (light/dark/glass) is read from tarmac:state,
     this page never writes to that key. ───────────────────────────────── */
  :root {
    --background: 240 5% 97%;
    --foreground: 0 0% 4%;
    --card: 0 0% 100%;
    --card-foreground: 0 0% 4%;
    --muted: 240 4% 95%;
    --muted-foreground: 240 3% 38%;
    --border: 240 2% 89%;
    --input: 240 2% 82%;
    --primary: 120 100% 34%;
    --primary-foreground: 0 0% 100%;
    --accent: 120 45% 94%;
    --accent-foreground: 120 100% 20%;
    --ring: 174 100% 31%;
    --ok: 120 100% 30%;
    --warn: 32 95% 44%;
    --danger: 2 68% 48%;
    --info: 210 70% 45%;
    --radius: 0.75rem;
    --shadow: 0 1px 3px hsl(0 0% 4% / 0.07);
    --shadow-md: 0 6px 18px hsl(0 0% 4% / 0.12);
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  html.dark {
    --background: 0 0% 4%;
    --foreground: 0 0% 96%;
    --card: 0 0% 8%;
    --card-foreground: 0 0% 96%;
    --muted: 0 0% 14%;
    --muted-foreground: 240 2% 66%;
    --border: 0 0% 18%;
    --input: 0 0% 24%;
    --primary: 120 100% 34%;
    --primary-foreground: 0 0% 100%;
    --accent: 174 60% 13%;
    --accent-foreground: 174 70% 72%;
    --ring: 174 100% 40%;
    --ok: 120 70% 50%; --warn: 36 90% 62%; --danger: 4 75% 70%; --info: 210 80% 70%;
    --shadow: 0 1px 2px hsl(0 0% 0% / 0.4);
    --shadow-md: 0 8px 22px hsl(0 0% 0% / 0.5);
  }
  html.liquid-glass {
    --background: 220 20% 94%;
    --foreground: 220 10% 12%;
    --card: 0 0% 100% / 0.45;
    --card-foreground: 220 10% 12%;
    --muted: 220 15% 92%;
    --muted-foreground: 220 6% 40%;
    --border: 0 0% 100% / 0.5;
    --input: 220 15% 88%;
    --primary: 210 60% 50%;
    --primary-foreground: 0 0% 100%;
    --accent: 210 50% 92%;
    --accent-foreground: 210 50% 28%;
    --ring: 210 60% 50%;
    --ok: 142 55% 38%; --warn: 32 95% 44%; --danger: 2 68% 48%;
    --radius: 1.25rem;
    --shadow: 0 4px 30px hsl(220 40% 50% / 0.08);
  }
  html.liquid-glass body {
    background: linear-gradient(135deg, hsl(210 40% 88%), hsl(260 30% 90%), hsl(320 20% 92%));
    background-attachment: fixed;
  }
  html.liquid-glass .topbar, html.liquid-glass .panel {
    background: hsla(var(--card));
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: hsl(var(--background));
    color: hsl(var(--foreground));
    font: 14px/1.5 "Outfit", "Aptos", ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 2px; }
  a { color: inherit; }
  h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .spacer { flex: 1; }
  .muted { color: hsl(var(--muted-foreground)); }
  .kicker { font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: hsl(var(--muted-foreground)); }
  .empty { color: hsl(var(--muted-foreground)); font-size: 13px; padding: 8px 2px; }

  /* ── Top bar ────────────────────────────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 20px;
    background: hsl(var(--card)); border-bottom: 1px solid hsl(var(--border));
  }
  .topbar .mark {
    width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; flex: none;
    background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); font-weight: 800; font-size: 13px;
  }
  .topbar .wordmark { font-size: 15px; font-weight: 800; letter-spacing: -0.03em; text-decoration: none; }
  .topbar .sep { width: 1px; height: 22px; background: hsl(var(--border)); margin: 0 4px; }
  .topbar .crumb { font-size: 13px; color: hsl(var(--muted-foreground)); white-space: nowrap; }
  .topbar .crumb strong { color: hsl(var(--foreground)); font-weight: 600; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 32px; padding: 0 12px; font: inherit; font-size: 12.5px; font-weight: 600; white-space: nowrap;
    border: 1px solid hsl(var(--input)); border-radius: 8px;
    background: hsl(var(--card)); color: hsl(var(--card-foreground));
    cursor: pointer; user-select: none; text-decoration: none;
  }
  .btn:hover { background: hsl(var(--muted)); }
  .btn--primary { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border-color: hsl(var(--primary)); }
  .btn--primary:hover { background: hsl(var(--primary)); opacity: .9; }
  .btn--ghost { border-color: transparent; background: transparent; }
  .btn--sm { height: 26px; padding: 0 8px; font-size: 12px; }
  .btn--icon { width: 26px; padding: 0; }
  .btn.is-on { background: hsl(var(--muted)); border-color: hsl(var(--input)); }

  .input, .select {
    height: 32px; padding: 0 10px; font: inherit; font-size: 13px; width: 100%;
    border: 1px solid hsl(var(--input)); border-radius: 8px;
    background: hsl(var(--card)); color: hsl(var(--foreground));
  }
  textarea.input { height: auto; padding: 8px 10px; resize: vertical; }
  label.field { display: block; }
  label.field > span { display: block; font-size: 12px; margin-bottom: 4px; color: hsl(var(--muted-foreground)); }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .row > * { flex: 1 1 120px; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px; flex: none;
    font-size: 11px; font-weight: 600; line-height: 1;
    padding: 4px 8px; border-radius: 999px;
    border: 1px solid hsl(var(--border)); background: hsl(var(--muted)); color: hsl(var(--muted-foreground));
  }
  .badge--ok     { color: hsl(var(--ok));     border-color: hsl(var(--ok) / .35);     background: hsl(var(--ok) / .12); }
  .badge--warn   { color: hsl(var(--warn));   border-color: hsl(var(--warn) / .35);   background: hsl(var(--warn) / .12); }
  .badge--danger { color: hsl(var(--danger)); border-color: hsl(var(--danger) / .35); background: hsl(var(--danger) / .12); }
  .env--prod    { color: hsl(var(--danger)); border-color: hsl(var(--danger) / .35); background: hsl(var(--danger) / .12); }
  .env--preview { color: hsl(var(--info));   border-color: hsl(var(--info) / .35);   background: hsl(var(--info) / .12); }
  .env--support { color: hsl(var(--warn));   border-color: hsl(var(--warn) / .35);   background: hsl(var(--warn) / .12); }
  .env--scrum, .env--qa, .env--crunch { color: hsl(var(--ok)); border-color: hsl(var(--ok) / .35); background: hsl(var(--ok) / .12); }

  /* ── Layout ─────────────────────────────────────────────────────────── */
  main { max-width: 1680px; margin: 0 auto; padding: 20px; display: grid; gap: 16px;
    grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
  .span-all { grid-column: 1 / -1; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); padding: 16px; } }
  .panel {
    background: hsl(var(--card)); border: 1px solid hsl(var(--border));
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; min-width: 0;
  }
  .panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .panel-head h2 { font-size: 15px; }
  .panel-head .sub { font-size: 12px; color: hsl(var(--muted-foreground)); }

  /* next-up strip */
  .next { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .next-item { border: 1px solid hsl(var(--border)); border-radius: calc(var(--radius) - 2px);
    padding: 10px 12px; background: hsl(var(--background)); }
  .next-item .rel { font-size: 12px; font-weight: 700; }
  .next-item .what { font-weight: 500; margin: 2px 0 6px; }
  .next-item .when { display: flex; align-items: center; gap: 6px; font-size: 12px; color: hsl(var(--muted-foreground)); }

  /* stats */
  .stats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); margin-top: 14px; }
  .stat { border: 1px solid hsl(var(--border)); border-radius: calc(var(--radius) - 2px); padding: 10px 12px; }
  .stat .v { font-size: 22px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 11.5px; color: hsl(var(--muted-foreground)); }
  .stat--hero { background: hsl(var(--accent)); border-color: hsl(var(--primary) / .35); }
  .stat--hero .v { color: hsl(var(--accent-foreground)); }
  .formula { font-size: 12px; color: hsl(var(--muted-foreground)); margin-top: 10px; }
  label.check { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: hsl(var(--muted-foreground));
    margin-top: 10px; cursor: pointer; }
  label.check input { accent-color: hsl(var(--primary)); margin: 0; }
  details.split { margin-top: 12px; }
  details.split > summary { font-size: 12px; color: hsl(var(--muted-foreground)); cursor: pointer; }

  /* tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid hsl(var(--border)); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: hsl(var(--muted-foreground)); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.is-past td { opacity: .5; }
  tr.is-current td { background: hsl(var(--accent)); }
  tr.is-planning td { font-style: italic; }
  .nowrap { white-space: nowrap; }

  /* time off list */
  ul.plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  ul.plain li { display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    border: 1px solid hsl(var(--border)); border-radius: 8px; font-size: 13px; }
  ul.plain li.is-past { opacity: .55; }

  /* releases grid */
  .rel-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .rel-card { border: 1px solid hsl(var(--border)); border-radius: calc(var(--radius) - 2px); padding: 12px;
    background: hsl(var(--background)); }
  .rel-card.is-done { opacity: .6; }
  .rel-card h3 { font-size: 14px; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .ms { display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 13px;
    border-top: 1px dashed hsl(var(--border)); }
  .ms:first-of-type { border-top: 0; }
  .ms.is-past { opacity: .5; }
  .ms .d { font-size: 12px; color: hsl(var(--muted-foreground)); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ms .acts { display: none; }
  .ms:hover .acts, .ms:focus-within .acts { display: inline-flex; }

  dialog { border: 1px solid hsl(var(--border)); border-radius: var(--radius); padding: 18px; width: min(440px, 92vw);
    background: hsl(var(--card)); color: hsl(var(--foreground)); box-shadow: var(--shadow-md); }
  dialog::backdrop { background: hsl(0 0% 0% / .35); }
  dialog form { display: grid; gap: 10px; }
  dialog .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }

  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 20;
    background: hsl(var(--foreground)); color: hsl(var(--background)); padding: 8px 14px; border-radius: 8px;
    font-size: 13px; box-shadow: var(--shadow-md); }
</style>
</head>
<body>
<header class="topbar">
  <span class="mark">t</span>
  <a class="wordmark" href="index.html" title="Back to the dashboard">tarmac</a>
  <span class="sep"></span>
  <span class="crumb"><strong>REM release calendar</strong> · dev days, sprints, time off</span>
  <span class="spacer"></span>
  <button class="btn" id="btn-export" title="Download releases, sprints and time off as JSON">Export</button>
  <button class="btn" id="btn-import" title="Replace this page's data from a JSON export">Import</button>
  <input type="file" id="file-import" accept="application/json,.json" hidden />
  <a class="btn" href="index.html">Dashboard</a>
</header>

<main>
  <section class="panel span-all">
    <div class="panel-head"><h2>Next up</h2><span class="sub" id="next-sub"></span></div>
    <div class="next" id="next"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Dev days calculator</h2>
      <span class="sub">working days left before a milestone, net of time off</span>
    </div>
    <div class="row">
      <label class="field" style="flex:3 1 260px"><span>Count up to</span><select class="select" id="calc-target"></select></label>
      <label class="field"><span>From</span><input class="input" type="date" id="calc-from" /></label>
      <label class="field" style="flex:0 1 90px"><span>REM %</span><input class="input" type="number" min="0" max="100" id="calc-alloc" /></label>
      <label class="field" style="flex:0 1 90px"><span>Hrs / day</span><input class="input" type="number" min="1" max="24" step="0.5" id="calc-hours" /></label>
    </div>
    <label class="check"><input type="checkbox" id="calc-incl" /> Include the milestone day</label>
    <div class="stats" id="calc-stats"></div>
    <p class="formula" id="calc-formula"></p>
    <details class="split"><summary>Per-sprint split</summary><div class="table-wrap" id="calc-sprints"></div></details>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Time off &amp; holidays</h2><span class="sub" id="off-sub"></span></div>
    <form id="off-form">
      <div class="row">
        <label class="field"><span>From</span><input class="input" type="date" id="off-start" required /></label>
        <label class="field"><span>To (optional)</span><input class="input" type="date" id="off-end" /></label>
      </div>
      <div class="row" style="margin-top:10px">
        <label class="field" style="flex-basis:180px"><span>Label</span><input class="input" id="off-label" placeholder="e.g. Diwali, family trip" /></label>
        <label class="field"><span>Type</span>
          <select class="select" id="off-kind"><option value="pto">My time off</option><option value="holiday">Public holiday</option></select></label>
        <button class="btn btn--primary" type="submit" style="flex:0 0 auto">Add</button>
      </div>
    </form>
    <div style="margin-top:12px; display:flex; gap:6px; align-items:center">
      <span class="kicker">List</span><span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" id="off-past" type="button">Show past</button>
    </div>
    <ul class="plain" id="off-list" style="margin-top:6px"></ul>
  </section>

  <section class="panel span-all" hidden>
    <div class="panel-head">
      <h2>Sprints</h2><span class="sub" id="sprint-sub"></span><span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" id="sprint-past" type="button">Show past</button>
    </div>
    <div class="table-wrap" id="sprints"></div>
  </section>

  <section class="panel span-all">
    <div class="panel-head">
      <h2>Releases</h2><span class="sub">hover a milestone to edit it</span><span class="spacer"></span>
      <select class="select" id="rel-year" style="width:auto" aria-label="Year"></select>
      <button class="btn btn--ghost btn--sm" id="rel-done" type="button">Show finished</button>
      <button class="btn btn--sm" id="rel-add" type="button">+ Milestone</button>
    </div>
    <div class="rel-grid" id="releases"></div>
  </section>
</main>

<dialog id="ms-dlg">
  <form method="dialog" id="ms-form">
    <h3 id="ms-title">Milestone</h3>
    <div class="row">
      <label class="field"><span>Release</span><input class="input" name="release" placeholder="27.1" required /></label>
      <label class="field"><span>Type</span>
        <select class="select" name="category"><option value="">—</option><option value="Major">Major</option><option value="Dot">Dot release</option></select></label>
    </div>
    <label class="field"><span>Milestone</span><input class="input" name="name" placeholder="e.g. Prod deployment" required /></label>
    <div class="row">
      <label class="field"><span>Date</span><input class="input" type="date" name="date" required /></label>
      <label class="field"><span>Environment</span>
        <select class="select" name="env">
          <option value="">—</option><option>scrum</option><option>qa</option><option>crunch</option>
          <option>preview</option><option>support</option><option>prod</option>
        </select></label>
    </div>
    <label class="field"><span>Link (optional)</span><input class="input" name="url" placeholder="Release notes / Jira fix version" /></label>
    <label class="field"><span>Notes (optional)</span><textarea class="input" name="notes" rows="2"></textarea></label>
    <div class="acts">
      <button class="btn btn--ghost" value="del" id="ms-del" formnovalidate>Delete</button>
      <span class="spacer"></span>
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn btn--primary" value="ok">Save</button>
    </div>
  </form>
</dialog>

  function safeUrl(url) {
    const u = String(url || "").trim();
    if (!u) return "#";

  const DAY_MS = 86400000;

  const keyOf = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

  const fmt = (k, opts) => parseKey(k).toLocaleDateString([], opts || { weekday: "short", month: "short", day: "numeric" });
  const fmtY = (k) => fmt(k, { month: "short", day: "numeric", year: "numeric" });
  const isWeekend = (k) => { const g = parseKey(k).getDay(); return g === 0 || g === 6; };

    const n = daysBetween(todayKey(), k);
    if (n < 0) return `<span class="badge">${-n}d ago</span>`;

    m = m || {};

    s = s || {};
    const o = { id: s.id || uid(), name: String(s.name || ""), start: isKey(s.start) ? s.start : todayKey(),
                planning: !!s.planning, remRelease: String(s.remRelease || ""), notes: String(s.notes || "") };
    o.end = isKey(s.end) && s.end >= o.start ? s.end : o.start;

  function dashState() { try { return JSON.parse(localStorage.getItem("tarmac:state") || "null") || {}; } catch (e) { return {}; } }
  function applyTheme() {
    const t = dashState().theme || "system";
    const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);

    const cap = dashState().capacity || {};
    const items = Array.isArray(cap.items) ? cap.items : [];
    const rem = items.find(i => /rem/i.test(i.label || "") && /dev/i.test(i.label || "")) || items.find(i => /rem/i.test(i.label || ""));

  // Day sets of public holidays and personal time off (weekdays only).
  function offSets() {
    const holiday = new Set(), pto = new Set();
    state.timeOff.forEach(o => {

  // Breakdown of [a, b] inclusive. A day that is both a holiday and PTO counts as a holiday.
  function workdays(a, b, sets) {
    const r = { calendar: 0, weekdays: 0, holidays: 0, pto: 0, available: 0 };
    if (!a || !b || b < a) return r;
    sets = sets || offSets();
    for (let k = a; k <= b; k = addDaysKey(k, 1)) {
      r.calendar++;
      if (isWeekend(k)) continue;
      r.weekdays++;
      if (sets.holiday.has(k)) r.holidays++;
      else if (sets.pto.has(k)) r.pto++;
      else r.available++;
    }
    return r;
  }
  const label = (m) => [m.release, m.name].filter(Boolean).join(" · ");
  const byDate = () => state.milestones.slice().sort((a, b) => a.date.localeCompare(b.date) || a.release.localeCompare(b.release));
  function defaultTarget() {
    const up = byDate().filter(m => m.date >= todayKey());
    return (up.find(m => /rem code freeze/i.test(m.name)) || up.find(m => /freeze/i.test(m.name)) || up[0] || {}).id || "";
  }

  // ── renderers ──────────────────────────────────────────────────────
  const ui = { offPast: false, sprintPast: false, relDone: false, year: String(new Date().getFullYear()) };

  function renderNext() {
    const up = byDate().filter(m => m.date >= todayKey()).slice(0, 6);
    $("#next-sub").textContent = up.length ? "" : "nothing scheduled";
    $("#next").innerHTML = up.map(m => `
      <div class="next-item">
        <div class="rel">${esc(m.release)}${m.category ? ` <span class="muted">· ${m.category === "Dot" ? "Dot" : "Major"}</span>` : ""}</div>
        <div class="what">${esc(m.name)}</div>
        <div class="when">${esc(fmtY(m.date))}<span class="spacer"></span>
          ${m.env ? `<span class="badge env--${m.env}">${esc(m.env)}</span>` : ""}${countdown(m.date)}</div>
      </div>`).join("") || `<p class="empty">No upcoming milestones.</p>`;
  }

  function renderCalc() {
    const sel = $("#calc-target");
    const today = todayKey();
    if (!state.calc.target || !state.milestones.some(m => m.id === state.calc.target)) state.calc.target = defaultTarget();
    // Upcoming milestones as <optgroup> per release (in date order of each release's first milestone).
    const groups = new Map();
    byDate().filter(m => m.date >= today || m.id === state.calc.target).forEach(m => {
      if (!groups.has(m.release)) groups.set(m.release, []);
      groups.get(m.release).push(m);
    });
    if (document.activeElement !== sel) {
      sel.innerHTML = [...groups].map(([rel, list]) => `<optgroup label="${esc(rel || "Other")}">` +
        list.map(m => `<option value="${m.id}"${m.id === state.calc.target ? " selected" : ""}>${esc(m.name)} — ${esc(fmtY(m.date))}</option>`).join("") +
        `</optgroup>`).join("");
    }
    const dflt = capacityDefaults();
    const alloc = state.calc.alloc == null ? dflt.alloc : state.calc.alloc;
    const hours = state.calc.hours == null ? dflt.hours : state.calc.hours;
    const fromEl = $("#calc-from"), allocEl = $("#calc-alloc"), hoursEl = $("#calc-hours");
    if (document.activeElement !== allocEl) { allocEl.value = alloc; allocEl.placeholder = dflt.alloc; }
    if (document.activeElement !== hoursEl) { hoursEl.value = hours; }
    $("#calc-incl").checked = !!state.calc.inclusive;
    const from = isKey(fromEl.value) ? fromEl.value : today;
    if (!fromEl.value) fromEl.placeholder = today;

    const target = state.milestones.find(m => m.id === state.calc.target);
    if (!target) { $("#calc-stats").innerHTML = `<p class="empty">Add a milestone to count towards.</p>`; $("#calc-formula").textContent = ""; $("#calc-sprints").innerHTML = ""; return; }
    const end = state.calc.inclusive ? target.date : addDaysKey(target.date, -1);
    const sets = offSets();
    const w = workdays(from, end, sets);
    const dev = w.available * alloc / 100;
    const stat = (v, l, hero) => `<div class="stat${hero ? " stat--hero" : ""}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
    const r1 = (n) => (Math.round(n * 10) / 10).toString();
    $("#calc-stats").innerHTML =
      stat(r1(dev), "dev days for REM", true) +
      stat(r1(dev * hours), "dev hours") +
      stat(w.available, "working days") +
      stat(w.holidays + w.pto ? "−" + (w.holidays + w.pto) : 0, "days off");
    $("#calc-formula").textContent = end < from
      ? `${label(target)} is before the start date.`
      : `${fmtY(from)} → ${fmtY(end)} (${w.calendar} calendar days) · (${w.weekdays} weekdays − ${w.holidays} holidays − ${w.pto} time off) × ${alloc}% = ${r1(dev)} days` +
        (state.calc.alloc == null && dflt.from ? ` · allocation from ${dflt.from}` : "");

    // Per-sprint split of the same window.
    const rows = state.sprints.filter(s => !s.planning && s.end >= from && s.start <= end).map(s => {
      const a = s.start > from ? s.start : from, b = s.end < end ? s.end : end;
      const sw = workdays(a, b, sets);
      return `<tr><td class="nowrap">${esc(s.name)}</td><td class="nowrap">${esc(fmt(a, { month: "short", day: "numeric" }))} – ${esc(fmt(b, { month: "short", day: "numeric" }))}</td>
        <td>${esc(s.remRelease)}</td><td class="num">${sw.available}</td><td class="num">${r1(sw.available * alloc / 100)}</td></tr>`;
    });
    $("#calc-sprints").innerHTML = rows.length ? `
      <table style="margin-top:8px"><thead><tr><th>Sprint</th><th>Window</th><th>REM release</th><th class="num">Working</th><th class="num">Dev</th></tr></thead>
      <tbody>${rows.join("")}</tbody></table>` : "";
  }

  function renderOff() {
    const today = todayKey();
    const list = state.timeOff.slice().sort((a, b) => a.start.localeCompare(b.start))
      .filter(o => ui.offPast || o.end >= today);
    const sets = offSets();
    const year = String(new Date().getFullYear());
    const ptoThisYear = [...sets.pto].filter(k => k.startsWith(year + "-")).length;
    $("#off-sub").textContent = `${ptoThisYear} weekday${ptoThisYear === 1 ? "" : "s"} off in ${year}`;
    $("#off-past").classList.toggle("is-on", ui.offPast);
    $("#off-list").innerHTML = list.map(o => {
      const n = workdays(o.start, o.end).weekdays;
      return `<li class="${o.end < today ? "is-past" : ""}" data-id="${o.id}">
        <span class="badge${o.kind === "holiday" ? " env--preview" : " badge--warn"}">${o.kind === "holiday" ? "holiday" : "time off"}</span>
        <span>${esc(o.label || (o.kind === "holiday" ? "Holiday" : "Time off"))}</span>
        <span class="spacer"></span>
        <span class="muted nowrap">${esc(o.start === o.end ? fmtY(o.start) : fmt(o.start, { month: "short", day: "numeric" }) + " – " + fmtY(o.end))} · ${n}d</span>
        <button class="btn btn--ghost btn--sm btn--icon" data-act="del" title="Remove">✕</button></li>`;
    }).join("") || `<li class="muted" style="border-style:dashed">No ${ui.offPast ? "" : "upcoming "}time off. Add public holidays and leave so dev days stay honest.</li>`;
  }

  function renderSprints() {
    const today = todayKey();
    const sets = offSets();
    const cur = state.sprints.find(s => !s.planning && s.start <= today && s.end >= today);
    if (cur) {
      const left = workdays(today, cur.end, sets).available, total = workdays(cur.start, cur.end, sets).available;
      $("#sprint-sub").textContent = `now: ${cur.name} · ${left} of ${total} working days left · REM ${cur.remRelease}`;
    } else $("#sprint-sub").textContent = "";
    $("#sprint-past").classList.toggle("is-on", ui.sprintPast);
    const rows = state.sprints.slice().sort((a, b) => a.start.localeCompare(b.start))
      .filter(s => ui.sprintPast || s.end >= today);
    $("#sprints").innerHTML = rows.length ? `<table>
      <thead><tr><th>Sprint</th><th>Dates</th><th>REM dev WIP</th><th>REM freeze</th><th>Integration</th><th>Notes</th><th class="num">Working days</th></tr></thead>
      <tbody>${rows.map(s => {
        const w = workdays(s.start, s.end, sets);
        const cls = s.end < today ? "is-past" : s === cur ? "is-current" : "";
        const integ = s.intStart || s.intEnd ? [s.intStart && "from " + fmt(s.intStart, { month: "short", day: "numeric" }), s.intEnd && "to " + fmt(s.intEnd, { month: "short", day: "numeric" })].filter(Boolean).join(" ") + (s.qaRelease ? ` (${esc(s.qaRelease)})` : "") : "";
        return `<tr class="${cls}${s.planning ? " is-planning" : ""}">
          <td class="nowrap">${esc(s.name)}</td>
          <td class="nowrap">${esc(fmt(s.start, { month: "short", day: "numeric" }))} – ${esc(fmtY(s.end))}</td>
          <td>${esc(s.remRelease)}</td>
          <td class="nowrap">${s.remFreeze ? esc(fmt(s.remFreeze)) : ""}</td>
          <td class="nowrap">${integ}</td>
          <td class="muted">${esc(s.notes)}</td>
          <td class="num">${w.available}${w.holidays + w.pto ? ` <span class="muted">/ ${w.weekdays}</span>` : ""}</td></tr>`;
      }).join("")}</tbody></table>` : `<p class="empty">No upcoming sprints.</p>`;
  }

  function renderReleases() {
    const today = todayKey();
    const years = [...new Set(state.milestones.map(m => m.date.slice(0, 4)))].sort();
    const yearSel = $("#rel-year");
    if (ui.year !== "all" && !years.includes(ui.year)) ui.year = years[years.length - 1] || "all";
    yearSel.innerHTML = years.map(y => `<option value="${y}"${y === ui.year ? " selected" : ""}>${y}</option>`).join("") +
      `<option value="all"${ui.year === "all" ? " selected" : ""}>All years</option>`;
    $("#rel-done").classList.toggle("is-on", ui.relDone);
    // Group by release; a release belongs to the year of its first milestone.
    const groups = new Map();
    byDate().forEach(m => {
      if (!groups.has(m.release)) groups.set(m.release, []);
      groups.get(m.release).push(m);
    });
    const cards = [...groups].filter(([, list]) => ui.year === "all" || list[0].date.startsWith(ui.year))
      .map(([rel, list]) => ({ rel, list, done: list[list.length - 1].date < today }))
      .filter(g => ui.relDone || !g.done);
    $("#releases").innerHTML = cards.map(g => {
      const cat = (g.list.find(m => m.category) || {}).category;
      return `<div class="rel-card${g.done ? " is-done" : ""}">
        <h3>${esc(g.rel || "Other")}${cat ? `<span class="badge">${cat === "Dot" ? "Dot release" : "Major"}</span>` : ""}</h3>
        ${g.list.map(m => `
          <div class="ms${m.date < today ? " is-past" : ""}" data-id="${m.id}"${m.notes ? ` title="${esc(m.notes)}"` : ""}>
            <span class="d">${esc(fmt(m.date))}</span>
            ${m.url ? `<a href="${esc(safeUrl(m.url))}" target="_blank" rel="noopener">${esc(m.name)}</a>` : `<span>${esc(m.name)}</span>`}
            ${m.env ? `<span class="badge env--${m.env}">${esc(m.env)}</span>` : ""}
            <span class="spacer"></span>
            <span class="acts"><button class="btn btn--ghost btn--sm btn--icon" data-act="edit" title="Edit">✏️</button></span>
            ${m.date >= today ? countdown(m.date) : ""}
          </div>`).join("")}
      </div>`;
    }).join("") || `<p class="empty">No ${ui.relDone ? "" : "open "}releases in ${ui.year === "all" ? "any year" : ui.year}.</p>`;
  }

  function render() { renderNext(); renderCalc(); renderOff(); renderSprints(); renderReleases(); }

  // ── events ─────────────────────────────────────────────────────────
  $("#calc-target").addEventListener("change", (e) => mutate(s => { s.calc.target = e.target.value; }));
  $("#calc-from").addEventListener("input", renderCalc);   // transient: always reopens on today
  $("#calc-alloc").addEventListener("input", (e) => { state.calc.alloc = e.target.value === "" ? null : Math.min(100, Math.max(0, +e.target.value)); save(); renderCalc(); });
  $("#calc-hours").addEventListener("input", (e) => { state.calc.hours = e.target.value === "" ? null : Math.min(24, Math.max(1, +e.target.value)); save(); renderCalc(); });
  $("#calc-incl").addEventListener("change", (e) => mutate(s => { s.calc.inclusive = e.target.checked; }));

  $("#off-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const start = $("#off-start").value; if (!isKey(start)) return;
    mutate(s => { s.timeOff.push(normOff({ start, end: $("#off-end").value || start, label: $("#off-label").value.trim(), kind: $("#off-kind").value })); });
    $("#off-start").value = $("#off-end").value = $("#off-label").value = "";
  });
  $("#off-list").addEventListener("click", (e) => {
    const li = e.target.closest("li[data-id]");
    if (li && e.target.closest("[data-act=del]")) mutate(s => { s.timeOff = s.timeOff.filter(o => o.id !== li.dataset.id); });
  });
  $("#off-past").addEventListener("click", () => { ui.offPast = !ui.offPast; renderOff(); });
  $("#sprint-past").addEventListener("click", () => { ui.sprintPast = !ui.sprintPast; renderSprints(); });
  $("#rel-done").addEventListener("click", () => { ui.relDone = !ui.relDone; renderReleases(); });
  $("#rel-year").addEventListener("change", (e) => { ui.year = e.target.value; renderReleases(); });

  // Milestone add / edit / delete via one dialog.
  const dlg = $("#ms-dlg"), form = $("#ms-form");
  let editing = null;
  function openMilestone(m) {
    editing = m;
    $("#ms-title").textContent = m ? "Edit milestone" : "Add milestone";
    $("#ms-del").hidden = !m;
    const v = m || { release: "", category: "", name: "", date: todayKey(), env: "", url: "", notes: "" };
    ["release", "category", "name", "date", "env", "url", "notes"].forEach(k => { form.elements[k].value = v[k] || ""; });
    dlg.returnValue = "";
    dlg.showModal();
  }
  dlg.addEventListener("close", () => {
    const act = dlg.returnValue;
    if (act === "del" && editing) {
      if (confirm(`Delete “${label(editing)}”?`)) mutate(s => { s.milestones = s.milestones.filter(x => x.id !== editing.id); });
    } else if (act === "ok") {
      const vals = {}; ["release", "category", "name", "date", "env", "url", "notes"].forEach(k => { vals[k] = form.elements[k].value.trim(); });
      mutate(s => {
        if (!editing) s.milestones.push(normMilestone(vals));
        else { const t = s.milestones.find(x => x.id === editing.id); if (t) Object.assign(t, normMilestone({ ...vals, id: t.id })); }
      });
    }
    editing = null;
  });
  $("#rel-add").addEventListener("click", () => openMilestone(null));
  $("#releases").addEventListener("click", (e) => {
    const row = e.target.closest(".ms[data-id]");
    if (row && e.target.closest("[data-act=edit]")) openMilestone(state.milestones.find(m => m.id === row.dataset.id));
  });

  // Export / import (this page's key only; a bad file never wipes state).
  $("#btn-export").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `tarmac-releases-${todayKey()}.json`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $("#btn-import").addEventListener("click", () => $("#file-import").click());
  $("#file-import").addEventListener("change", (e) => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => {
      const o = JSON.parse(t);
      if (!looksLikeState(o)) throw new Error("not a releases export");
      if (!confirm("Replace releases, sprints and time off with this file?")) return;
      state = normalize(o); save(); render(); toast("Imported.");
    }).catch(err => toast("Import failed: " + err.message)).finally(() => { e.target.value = ""; });
  });

  // Re-render at local midnight so countdowns and "today" stay right on a pinned tab.
  let lastDay = todayKey();
  setInterval(() => { if (todayKey() !== lastDay) { lastDay = todayKey(); render(); } }, 30000);

  applyTheme();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
  render();
})();
</script>
</body>
</html>
